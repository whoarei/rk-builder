name: Build ffmpeg-rockchip deb

on:
  push:
    tags: ["ffmpeg-rockchip-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Export ffmpeg deb
        run: |
          docker build --target ffmpeg-debs --output type=local,dest="$PWD/dist" .
          ls -la dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rockchip-dev-arm64
          path: |
            dist/*.deb
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/ffmpeg-rockchip-dev_*.deb dist/ffmpeg-rockchip-dev_*.sha256
          --verify-tag
          --generate-notes
          --title "ffmpeg-rockchip 6.1 ARM64 Debian package"
