name: Build rockchip-mpp deb

on:
  push:
    tags: ["mpp-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Export mpp deb
        run: |
          docker build --target mpp-debs --output type=local,dest="$PWD/dist" .
          ls -la dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockchip-mpp-dev-arm64
          path: |
            dist/*.deb
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/rockchip-mpp-dev_*.deb dist/rockchip-mpp-dev_*.sha256
          --verify-tag
          --generate-notes
          --title "rockchip-mpp 1.1.0 ARM64 Debian package"
