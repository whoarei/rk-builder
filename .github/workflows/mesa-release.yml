name: Build Mesa debs

on:
  push:
    tags: ["mesa-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Export Mesa debs
        run: |
          mesa_deb_version=25.0.7-2
          if [[ $GITHUB_REF == refs/tags/mesa-v* ]]; then
              mesa_deb_version=${GITHUB_REF_NAME#mesa-v}
          fi
          docker build --build-arg MESA_DEB_VERSION="$mesa_deb_version" \
            --target mesa-debs --output type=local,dest="$PWD/dist" .
      - uses: actions/upload-artifact@v4
        with:
          name: mesa25-ans-arm64
          path: |
            dist/*.deb
            dist/*.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mesa_deb_version=${GITHUB_REF_NAME#mesa-v}
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 \
            --verify-tag --generate-notes \
            --title "Mesa $mesa_deb_version ARM64 Debian packages"
