name: Build librga deb

on:
  push:
    tags: ["librga-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Export librga deb
        run: |
          docker build --target librga-debs --output type=local,dest="$PWD/dist" .
          ls -la dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: librga-dev-arm64
          path: |
            dist/*.deb
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/librga*.deb dist/librga*.sha256
          --verify-tag
          --generate-notes
          --title "librga 1.10.6 ARM64 Debian package"
