name: Build librga deb

on:
  push:
    tags: ["librga-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 deb
        run: ./scripts/build-librga-deb.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: librga-dev-arm64
          path: |
            dist/*.deb
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.deb dist/*.sha256
          --verify-tag
          --generate-notes
          --title "librga 1.10.6 ARM64 Debian package"
